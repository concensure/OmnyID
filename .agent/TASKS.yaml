version: 1
updated: 2026-10-05

lifecycle:
  allowed_statuses:
    - proposed
    - ready
    - in_progress
    - blocked
    - review
    - done
  ownership_rule: "Exactly one owner may hold an in_progress task at a time."
  branch_rule: "Agent-owned implementation work should happen on the task branch unless the user directs otherwise."
  pr_rule: "Use PRs as cross-agent review boundaries before merging task branches to main."
  file_rule: "Agents should treat another active task's files as owned unless they coordinate in HANDOFF.md."

