      OMNYID_STRIPE_SKIP_WEBHOOK_VERIFY: ${OMNYID_STRIPE_SKIP_WEBHOOK_VERIFY:-false}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
      COMPOSIO_API_KEY_FILE: ${COMPOSIO_API_KEY_FILE:-/run/secrets/composio_api_key}
