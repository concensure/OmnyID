      OMNYID_MISTRAL_API_KEY_FILE: ${OMNYID_MISTRAL_API_KEY_FILE:-}
      OMNYID_ANTHROPIC_KEY_FILE: ${OMNYID_ANTHROPIC_KEY_FILE:-/run/secrets/omnyid_anthropic_api_key}
      OMNYID_WEDDING_OUTREACH_CEREBRAS_MODEL: ${OMNYID_WEDDING_OUTREACH_CEREBRAS_MODEL:-qwen-3.8-27b}
