      OMNYID_VENDOR_LISTING_PROPOSALS_ENABLED: ${OMNYID_VENDOR_LISTING_PROPOSALS_ENABLED:-false}
      CLAMD_HOST: ${CLAMD_HOST:-clamav:3310}
      OMNYID_VENDOR_SENDER_MASK_ENABLED: ${OMNYID_VENDOR_SENDER_MASK_ENABLED:-false}
