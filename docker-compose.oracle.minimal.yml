      OMNYID_OPERATOR_EMAIL_RELAY_SENDERS: ${OMNYID_OPERATOR_EMAIL_RELAY_SENDERS:-}
      OMNYID_OPERATOR_EMAIL_RELAY_ENCRYPTION_KEY_HEX_FILE: ${OMNYID_OPERATOR_EMAIL_RELAY_ENCRYPTION_KEY_HEX_FILE:-}
      OMNYID_OPERATOR_EMAIL_RELAY_CLOUDFLARE_ACCOUNT_ID: ${OMNYID_OPERATOR_EMAIL_RELAY_CLOUDFLARE_ACCOUNT_ID:-}
      OMNYID_OPERATOR_EMAIL_RELAY_CLOUDFLARE_API_TOKEN_FILE: ${OMNYID_OPERATOR_EMAIL_RELAY_CLOUDFLARE_API_TOKEN_FILE:-}
      OMNYID_WEDDING_BINDER_ENABLED: ${OMNYID_WEDDING_BINDER_ENABLED:-false}
      OMNYID_WEDDING_MEASUREMENT_ENABLED: ${OMNYID_WEDDING_MEASUREMENT_ENABLED:-false}
      OMNYID_WEEKLY_OPERATOR_REPORT_ENABLED: ${OMNYID_WEEKLY_OPERATOR_REPORT_ENABLED:-false}
      OMNYID_WEEKLY_OPERATOR_REPORT_RECIPIENT: ${OMNYID_WEEKLY_OPERATOR_REPORT_RECIPIENT:-}
      OMNYID_WEEKLY_REPORT_DISK_ROOT: ${OMNYID_WEEKLY_REPORT_DISK_ROOT:-/}
