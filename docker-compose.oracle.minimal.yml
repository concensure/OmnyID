      - "127.0.0.1:18080:8080"
      - "443:8443/udp"
    volumes:
      - ./.secrets:/run/secrets:ro
      - ./scripts/runtime-env-entrypoint.sh:/usr/local/bin/runtime-env-entrypoint.sh:ro
      - /home/ubuntu/letsencrypt:/letsencrypt:ro
    networks:
      - default
      - storage
    restart: unless-stopped

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      homeserver:
        condition: service_started
      ui:
        condition: service_completed_successfully
    environment:
      OMNYID_DOMAIN: ${OMNYID_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      OMNYID_PREVIEW_USERNAME: ${OMNYID_PREVIEW_USERNAME}
      OMNYID_PREVIEW_PASSWORD_HASH: ${OMNYID_PREVIEW_PASSWORD_HASH}
      OMNYID_STAGING_USER: ${OMNYID_STAGING_USER:-staging}
      OMNYID_STAGING_PASSWORD_HASH: ${OMNYID_STAGING_PASSWORD_HASH:?set in .env.oracle}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./docs:/srv/docs:ro
      - ./wedding:/srv/wedding:ro
      - workspace-assets:/srv/workspace:ro
      - staging-workspace-assets:/srv/staging-workspace:ro
      - caddy-data:/data
      - caddy-config:/config

  # ── Nightly backup cron ──────────────────────────────────────────────────────
  # Runs omnyid-backup.sh at 02:00 UTC every day; keeps 30 days of archives.
  # Set OMNYID_BACKUP_DIR on the host to override /var/backups/omnyid.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    depends_on:
      - postgres
    environment:
      OMNYID_PG_HOST: postgres
      OMNYID_PG_PORT: "5432"
      OMNYID_PG_USER: ${POSTGRES_USER:-afp}
      OMNYID_PG_PASSWORD: ${POSTGRES_PASSWORD:-}
      OMNYID_PG_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      OMNYID_PG_DB: ${POSTGRES_DB:-afp}
      OMNYID_BACKUP_RETAIN: "${OMNYID_BACKUP_RETAIN:-30}"
    volumes:
      - ./.secrets:/run/secrets:ro
      - ./scripts/omnyid-backup.sh:/usr/local/bin/omnyid-backup.sh:ro
      - ./scripts/omnyid-backup-verify.sh:/usr/local/bin/omnyid-backup-verify.sh:ro
      - ${OMNYID_BACKUP_DIR:-/var/backups/omnyid}:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mkdir -p /backups
        while true; do
          latest_dir=""
          if bash /usr/local/bin/omnyid-backup.sh /backups >> /var/log/omnyid-backup.log 2>&1; then
            latest_dir="$$(find /backups -maxdepth 1 -mindepth 1 -type d -name '20*Z' | sort | tail -n 1)"
          fi
          if [[ -n "$${latest_dir}" ]]; then
            if bash /usr/local/bin/omnyid-backup-verify.sh "$${latest_dir}" >> /var/log/omnyid-backup.log 2>&1; then
              python3 -c "import json, sys; from datetime import datetime, timezone; path=sys.argv[1]; data=json.load(open(path, 'r', encoding='utf-8')); data['verification']={'status':'passed','verified_at':datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')}; json.dump(data, open(path, 'w', encoding='utf-8'), indent=2); open(path, 'a', encoding='utf-8').write('\n')" "$${latest_dir}/manifest.json"
            else
              echo "[omnyid-backup] Verification failed for $${latest_dir}" >> /var/log/omnyid-backup.log 2>&1
            fi
          fi
          sleep 86400
        done
    restart: unless-stopped

volumes:
  postgres-data:
  seaweedfs-data:
  clamav-data:
  workspace-assets:
  # Filled by the staging stack; declared here so Caddy can mount it read-only.
  staging-workspace-assets:
    name: omnyid-staging-workspace-assets
  caddy-data:
  caddy-config:

networks:
  storage:
    internal: true
