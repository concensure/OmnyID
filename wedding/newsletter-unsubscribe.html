<main id="main" tabindex="-1">
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow">✦ Newsletter</p>
      <h1>Unsubscribe from the newsletter</h1>
      <p id="unsubIntro">Confirm below and we'll stop emailing you new planning guides.</p>
      <div class="unsub-actions">
        <button class="btn btn-primary btn-lg" type="button" id="unsubButton">Unsubscribe</button>
        <a class="btn btn-outline btn-lg" href="index.html">Keep me subscribed</a>
      </div>
      <p class="newsletter-status" id="unsubStatus" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<script>
(function () {
  var token = new URLSearchParams(window.location.search).get('token') || '';
  var button = document.getElementById('unsubButton');
  var status = document.getElementById('unsubStatus');
  function show(message, kind) {
    status.textContent = message;
    status.className = 'newsletter-status' + (kind ? ' is-' + kind : '');
  }
  if (!token) {
    button.disabled = true;
    show('This page needs the unsubscribe link from one of our emails. Contact hello@omnyid.com if you need help.', 'error');
    return;
  }
  button.addEventListener('click', function () {
    button.disabled = true;
    show('Unsubscribing…', '');
    fetch('/wedding/newsletter/unsubscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token })
    }).then(function (response) {
      if (!response.ok) {
        return response.text().then(function (text) { throw new Error(text || 'Something went wrong. Please try again.'); });
      }
      show("You're unsubscribed. You won't receive any more newsletters from us.", 'success');
    }).catch(function (err) {
      button.disabled = false;
      show(err.message || 'Something went wrong. Please try again.', 'error');
    });
  });
})();
</script>
