<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
  <title id="t">Four-page wedding newspaper layout plan</title>
  <desc id="d">Four page thumbnails showing what goes on each page: front page with headline and photo, the couple's story, guest fun and games, and the day's plan with answers.</desc>
  <rect width="1200" height="560" fill="#FBF6EF"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#2C241D">
    <g transform="translate(36 40)">
      <rect width="250" height="400" rx="4" fill="#FFFDF8" stroke="#D9CBB8"/>
      <rect x="16" y="16" width="218" height="40" fill="#2C241D"/>
      <text x="125" y="43" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFDF8">THE MASTHEAD</text>
      <rect x="16" y="70" width="218" height="26" fill="#E7DACB"/>
      <text x="125" y="88" text-anchor="middle" font-size="14" font-weight="700">BIG HEADLINE</text>
      <rect x="16" y="108" width="218" height="140" fill="#EADBC8"/>
      <text x="125" y="184" text-anchor="middle" font-size="13" font-style="italic" fill="#6B5D50">Hero photo</text>
      <rect x="16" y="262" width="104" height="6" rx="3" fill="#B9AA99"/><rect x="16" y="278" width="104" height="6" rx="3" fill="#B9AA99"/><rect x="16" y="294" width="90" height="6" rx="3" fill="#B9AA99"/>
      <rect x="130" y="262" width="104" height="70" fill="#0F5F5A"/>
      <text x="182" y="302" text-anchor="middle" font-size="13" fill="#FFFDF8">Weather box</text>
      <rect x="16" y="344" width="218" height="40" fill="#F4EADC"/>
      <text x="125" y="369" text-anchor="middle" font-size="12" fill="#6B5D50">Date · edition · tagline</text>
    </g>
    <text x="161" y="478" text-anchor="middle" font-size="16" font-weight="700">1 · Front page</text>
    <text x="161" y="499" text-anchor="middle" font-size="13" fill="#6B5D50">Headline, photo, welcome</text>

    <g transform="translate(326 40)">
      <rect width="250" height="400" rx="4" fill="#FFFDF8" stroke="#D9CBB8"/>
      <text x="16" y="36" font-size="17" font-weight="700">Our Story</text>
      <line x1="16" y1="46" x2="234" y2="46" stroke="#2C241D"/>
      <rect x="16" y="60" width="100" height="90" fill="#EADBC8"/><rect x="128" y="60" width="106" height="90" fill="#EADBC8"/>
      <g fill="#B9AA99"><rect x="16" y="166" width="218" height="6" rx="3"/><rect x="16" y="182" width="200" height="6" rx="3"/><rect x="16" y="198" width="218" height="6" rx="3"/><rect x="16" y="214" width="170" height="6" rx="3"/></g>
      <text x="16" y="254" font-size="14" font-weight="700">The Interview</text>
      <g fill="#B9AA99"><rect x="16" y="266" width="218" height="6" rx="3"/><rect x="16" y="282" width="190" height="6" rx="3"/><rect x="16" y="298" width="218" height="6" rx="3"/><rect x="16" y="314" width="160" height="6" rx="3"/></g>
      <rect x="16" y="340" width="218" height="44" fill="#F4EADC"/>
      <text x="125" y="367" text-anchor="middle" font-size="12" font-style="italic" fill="#6B5D50">Timeline: how we met</text>
    </g>
    <text x="451" y="478" text-anchor="middle" font-size="16" font-weight="700">2 · The couple</text>
    <text x="451" y="499" text-anchor="middle" font-size="13" fill="#6B5D50">Story, interview, timeline</text>

    <g transform="translate(616 40)">
      <rect width="250" height="400" rx="4" fill="#FFFDF8" stroke="#D9CBB8"/>
      <text x="16" y="36" font-size="17" font-weight="700">Guest Corner</text>
      <line x1="16" y1="46" x2="234" y2="46" stroke="#2C241D"/>
      <g stroke="#2C241D" fill="#FFFDF8"><rect x="16" y="62" width="22" height="22"/><rect x="38" y="62" width="22" height="22"/><rect x="60" y="62" width="22" height="22" fill="#2C241D"/><rect x="82" y="62" width="22" height="22"/><rect x="16" y="84" width="22" height="22" fill="#2C241D"/><rect x="38" y="84" width="22" height="22"/><rect x="60" y="84" width="22" height="22"/><rect x="82" y="84" width="22" height="22"/><rect x="16" y="106" width="22" height="22"/><rect x="38" y="106" width="22" height="22"/><rect x="60" y="106" width="22" height="22"/><rect x="82" y="106" width="22" height="22" fill="#2C241D"/></g>
      <text x="124" y="80" font-size="12" fill="#6B5D50">Crossword</text>
      <text x="124" y="100" font-size="12" fill="#6B5D50">+ word search</text>
      <rect x="16" y="146" width="218" height="86" fill="#F4EADC"/>
      <text x="125" y="170" text-anchor="middle" font-size="13" font-weight="700">GUEST HOROSCOPES</text>
      <g fill="#B9AA99"><rect x="32" y="182" width="186" height="6" rx="3"/><rect x="32" y="198" width="160" height="6" rx="3"/><rect x="32" y="214" width="170" height="6" rx="3"/></g>
      <rect x="16" y="246" width="104" height="138" fill="#FFFDF8" stroke="#2C241D" stroke-dasharray="4 3"/>
      <text x="68" y="312" text-anchor="middle" font-size="12" fill="#6B5D50">Classifieds</text>
      <rect x="130" y="246" width="104" height="138" fill="#0F5F5A"/>
      <text x="182" y="312" text-anchor="middle" font-size="12" fill="#FFFDF8">Quiz: who said it?</text>
    </g>
    <text x="741" y="478" text-anchor="middle" font-size="16" font-weight="700">3 · Guest fun</text>
    <text x="741" y="499" text-anchor="middle" font-size="13" fill="#6B5D50">Puzzles, quiz, classifieds</text>

    <g transform="translate(906 40)">
      <rect width="250" height="400" rx="4" fill="#FFFDF8" stroke="#D9CBB8"/>
      <text x="16" y="36" font-size="17" font-weight="700">Order of the Day</text>
      <line x1="16" y1="46" x2="234" y2="46" stroke="#2C241D"/>
      <g fill="#6B5D50" font-size="12"><text x="16" y="72">3:00  Ceremony</text><text x="16" y="94">4:00  Drinks &amp; canapés</text><text x="16" y="116">6:00  Dinner</text><text x="16" y="138">8:00  First dance</text><text x="16" y="160">11:00 Last song</text></g>
      <rect x="16" y="180" width="218" height="82" fill="#F4EADC"/>
      <text x="125" y="204" text-anchor="middle" font-size="13" font-weight="700">THANK YOU</text>
      <g fill="#B9AA99"><rect x="32" y="216" width="186" height="6" rx="3"/><rect x="32" y="232" width="150" height="6" rx="3"/></g>
      <rect x="16" y="278" width="104" height="106" fill="#EADBC8"/>
      <text x="68" y="334" text-anchor="middle" font-size="12" font-style="italic" fill="#6B5D50">Back photo</text>
      <rect x="130" y="278" width="104" height="106" fill="#FFFDF8" stroke="#2C241D" stroke-dasharray="4 3"/>
      <text x="182" y="334" text-anchor="middle" font-size="12" fill="#6B5D50">Puzzle answers</text>
    </g>
    <text x="1031" y="478" text-anchor="middle" font-size="16" font-weight="700">4 · Back page</text>
    <text x="1031" y="499" text-anchor="middle" font-size="13" fill="#6B5D50">Schedule, thanks, answers</text>
  </g>
</svg>

