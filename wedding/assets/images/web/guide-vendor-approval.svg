<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Vendor shortlist and approval screenshot</title>
  <desc id="desc">A screenshot-style illustration showing vendor shortlist rows, evidence labels and an approval preview.</desc>
  <rect width="960" height="560" fill="#fbf6ef"/>
  <rect x="54" y="44" width="852" height="472" rx="22" fill="#fffdfa" stroke="#e7dacb"/>
  <text x="90" y="94" font-family="Fraunces, Georgia" font-size="30" font-weight="600" fill="#2c241d">Caterer shortlist</text>
  <text x="90" y="124" font-family="Inter, Arial" font-size="15" fill="#6e6156">Select one option to scope follow-up reports and vendor outreach.</text>
  <rect x="90" y="162" width="500" height="74" rx="14" fill="#e3eadd" stroke="#8a9a7e"/>
  <circle cx="124" cy="199" r="12" fill="#8a9a7e"/>
  <path d="M118 199l5 5 10-12" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="154" y="193" font-family="Inter, Arial" font-size="16" font-weight="700" fill="#2c241d">Vine and Harvest Kitchen</text>
  <text x="154" y="216" font-family="Inter, Arial" font-size="13" fill="#6e6156">Shared-table menu, source-linked estimate, allergy menu pending.</text>
  <rect x="438" y="183" width="120" height="26" rx="13" fill="#fffdfa"/>
  <text x="458" y="201" font-family="Inter, Arial" font-size="11" font-weight="700" fill="#66765c">Best fit</text>
  <rect x="90" y="254" width="500" height="74" rx="14" fill="#fff" stroke="#e7dacb"/>
  <circle cx="124" cy="291" r="12" fill="#fff" stroke="#c17b87"/>
  <text x="154" y="285" font-family="Inter, Arial" font-size="16" font-weight="700" fill="#2c241d">Coastal Grazing Co.</text>
  <text x="154" y="308" font-family="Inter, Arial" font-size="13" fill="#6e6156">Grazing menu, price source labelled, capacity needs confirmation.</text>
  <rect x="90" y="346" width="500" height="74" rx="14" fill="#fff" stroke="#e7dacb"/>
  <circle cx="124" cy="383" r="12" fill="#fff" stroke="#c17b87"/>
  <text x="154" y="377" font-family="Inter, Arial" font-size="16" font-weight="700" fill="#2c241d">The Long Table Co.</text>
  <text x="154" y="400" font-family="Inter, Arial" font-size="13" fill="#6e6156">Plated menu, higher estimate, venue access details unknown.</text>
  <rect x="628" y="162" width="226" height="258" rx="16" fill="#2c241d"/>
  <text x="656" y="202" font-family="Inter, Arial" font-size="15" font-weight="700" fill="#fffdfa">Approval preview</text>
  <text x="656" y="236" font-family="Inter, Arial" font-size="13" fill="#f4eadc">Draft email to Vine and Harvest Kitchen.</text>
  <text x="656" y="270" font-family="Inter, Arial" font-size="13" fill="#f4eadc">Discloses guest count and dietary needs only.</text>
  <text x="656" y="304" font-family="Inter, Arial" font-size="13" fill="#f4eadc">Does not disclose full budget or other vendors.</text>
  <rect x="656" y="342" width="154" height="36" rx="18" fill="#c17b87"/>
  <text x="693" y="365" font-family="Inter, Arial" font-size="13" font-weight="700" fill="#fff">Approve</text>
  <rect x="656" y="392" width="154" height="36" rx="18" fill="none" stroke="#fffdfa"/>
  <text x="706" y="415" font-family="Inter, Arial" font-size="13" font-weight="700" fill="#fffdfa">Edit</text>
</svg>
