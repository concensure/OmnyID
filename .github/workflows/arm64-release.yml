name: ARM64 release candidate

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full committed source SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  homeserver-arm64:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'arm64-release')
    runs-on: ubuntu-24.04-arm
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}
      IMAGE_TAG: omnyid-homeserver:release-candidate
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Verify candidate provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          test "$(uname -m)" = "aarch64"

      - name: Build native ARM64 homeserver image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --tag "$IMAGE_TAG" \
            .
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Architecture}}')" = "arm64"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"

      - name: Package candidate and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/arm64-release
          docker save "$IMAGE_TAG" | gzip -1 > artifacts/arm64-release/omnyid-homeserver-arm64.tar.gz
          image_id="$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')"
          archive_sha="$(sha256sum artifacts/arm64-release/omnyid-homeserver-arm64.tar.gz | cut -d' ' -f1)"
          printf '{"source_commit":"%s","image_id":"%s","architecture":"arm64","archive_sha256":"%s"}\n' \
            "$SOURCE_SHA" "$image_id" "$archive_sha" > artifacts/arm64-release/manifest.json
          sha256sum artifacts/arm64-release/omnyid-homeserver-arm64.tar.gz > artifacts/arm64-release/SHA256SUMS

      - name: Upload exact candidate
        uses: actions/upload-artifact@v4
        with:
          name: homeserver-arm64-${{ env.SOURCE_SHA }}
          path: artifacts/arm64-release
          if-no-files-found: error
          retention-days: 3
