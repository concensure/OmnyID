<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password - OmnyID</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="tailwind.css">
  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(217, 107, 57, 0.08), transparent 30%),
        radial-gradient(circle at top right, rgba(82, 99, 82, 0.08), transparent 28%),
        #f9f9f7;
    }
  </style>
</head>
<body class="min-h-screen font-body text-on-surface antialiased">
  <main class="flex min-h-screen items-center justify-center p-4 sm:p-6">
    <div class="w-full max-w-sm rounded-3xl border border-outline-variant/40 bg-surface-container-lowest p-6 shadow-panel sm:p-8">
      <a href="/" class="font-mono text-[11px] uppercase tracking-[0.2em] text-outline">OmnyID</a>
      <h1 id="heading" class="mt-2 font-display text-3xl">Set a new password</h1>
      <p id="subheading" class="mt-2 text-sm leading-6 text-on-surface-variant">
        Choose a new password for your account.
      </p>

      <form id="reset-form" class="mt-6 space-y-4">
        <label class="grid gap-2 text-sm font-semibold">
          New password
          <input
            id="new-password"
            type="password"
            required
            minlength="8"
            autocomplete="new-password"
            placeholder="Use at least 8 characters"
            class="rounded-xl border border-outline-variant bg-surface-container-low px-4 py-3 outline-none focus:border-primary"
          >
        </label>
        <p id="feedback" class="hidden rounded-xl px-3 py-2 text-xs leading-5"></p>
        <button
          id="submit-button"
          type="submit"
          class="w-full cursor-pointer rounded-xl bg-primary px-5 py-3.5 font-medium text-white transition hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"
        >
          Reset password
        </button>
      </form>

      <div id="success-panel" class="mt-6 hidden">
        <a href="/#login" class="block w-full rounded-xl bg-primary px-5 py-3.5 text-center font-medium text-white transition hover:opacity-90">
          Go to sign in
        </a>
      </div>

      <p class="mt-6 text-center text-xs text-on-surface-variant">
        <a href="/" class="underline hover:text-on-surface">Back to OmnyID</a>
      </p>
    </div>
  </main>

  <script>
    (function () {
      var IS_LOCAL_DEV_HOST = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1";
      var API_BASE = IS_LOCAL_DEV_HOST ? "http://127.0.0.1:8080" : "https://api.omnyid.com";

      var heading = document.getElementById("heading");
      var subheading = document.getElementById("subheading");
      var form = document.getElementById("reset-form");
      var feedback = document.getElementById("feedback");
      var submitButton = document.getElementById("submit-button");
      var successPanel = document.getElementById("success-panel");

      var token = new URLSearchParams(window.location.search).get("token");

      function setFeedback(text, tone) {
        feedback.textContent = text;
        feedback.className = "rounded-xl px-3 py-2 text-xs leading-5 " + (
          tone === "error"
            ? "border border-error/30 bg-error/5 text-error"
            : "border border-primary/25 bg-primary/5 text-primary"
        );
      }

      if (!token) {
        heading.textContent = "Reset link incomplete";
        subheading.textContent = "This password reset link is missing its token. Request a fresh one from the sign-in form.";
        form.classList.add("hidden");
        return;
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        var newPassword = document.getElementById("new-password").value;
        submitButton.disabled = true;
        submitButton.textContent = "Resetting…";
        setFeedback("", "neutral");
        feedback.classList.add("hidden");

        fetch(API_BASE + "/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, new_password: newPassword })
        })
          .then(function (response) {
            return response.text().then(function (text) {
              var data;
              try { data = JSON.parse(text); } catch (err) { data = {}; }
              if (!response.ok) {
                throw new Error(data.message || text || "Could not reset your password.");
              }
              return data;
            });
          })
          .then(function () {
            heading.textContent = "Password reset";
            subheading.textContent = "Your password has been changed. All existing sessions were signed out for safety.";
            form.classList.add("hidden");
            successPanel.classList.remove("hidden");
          })
          .catch(function (error) {
            feedback.classList.remove("hidden");
            setFeedback(
              (error && error.message) || "Could not reset your password. The link may have expired — request a new one from the sign-in form.",
              "error"
            );
            submitButton.disabled = false;
            submitButton.textContent = "Reset password";
          });
      });
    })();
  </script>
</body>
</html>
