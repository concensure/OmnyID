<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify your email - OmnyID</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet"
  >
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#f9f9f7",
            "surface-container-low": "#f4f4f2",
            "surface-container-lowest": "#ffffff",
            "surface-container-high": "#e8e8e6",
            primary: "#31568e",
            "primary-fixed": "#d6e3ff",
            secondary: "#526352",
            "secondary-container": "#d4e8d3",
            "on-surface": "#1a1c1b",
            "on-surface-variant": "#434750",
            outline: "#737781",
            "outline-variant": "#c3c6d1",
            error: "#ba1a1a"
          },
          fontFamily: {
            display: ["EB Garamond", "serif"],
            body: ["Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(217, 107, 57, 0.08), transparent 30%),
        radial-gradient(circle at top right, rgba(82, 99, 82, 0.08), transparent 28%),
        #f9f9f7;
      color: #1a1c1b;
    }
  </style>
</head>
<body class="font-body text-on-surface min-h-screen">
  <main class="mx-auto flex min-h-screen max-w-xl flex-col items-center justify-center px-6 py-16 text-center">
    <a href="./index.html" class="font-mono text-xs uppercase tracking-[0.2em] text-outline transition hover:text-primary">← Back to OmnyID</a>

    <div class="mt-8 w-full rounded-[1.75rem] border border-outline-variant/10 bg-surface-container-lowest p-8 shadow-sm sm:p-10">
      <div id="verify-email-icon" class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-surface-container-high text-outline">
        <svg class="h-7 w-7 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>
      <h1 id="verify-email-title" class="mt-6 font-display text-3xl">Verifying your email...</h1>
      <p id="verify-email-message" class="mt-3 text-sm leading-relaxed text-on-surface-variant">
        Hold on while we confirm your verification link.
      </p>
      <div id="verify-email-actions" class="mt-6 hidden">
        <a href="./index.html" class="inline-flex rounded-lg bg-primary px-6 py-3 text-sm font-medium text-white transition hover:opacity-90">
          Sign in to OmnyID
        </a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const API_BASE = window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1"
        ? "http://127.0.0.1:8080"
        : "https://api.omnyid.com";

      const iconEl = document.getElementById("verify-email-icon");
      const titleEl = document.getElementById("verify-email-title");
      const messageEl = document.getElementById("verify-email-message");
      const actionsEl = document.getElementById("verify-email-actions");

      function showResult(ok, title, message) {
        iconEl.className = "mx-auto flex h-14 w-14 items-center justify-center rounded-full " +
          (ok ? "bg-secondary-container text-secondary" : "bg-error/10 text-error");
        iconEl.innerHTML = ok
          ? '<svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>'
          : '<svg class="h-7 w-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
        titleEl.textContent = title;
        messageEl.textContent = message;
        actionsEl.classList.remove("hidden");
      }

      const token = new URLSearchParams(window.location.search).get("token");
      if (!token) {
        showResult(false, "Missing verification link", "This page needs a verification token in the URL. Use the link from your email, or request a new one from the sign-in screen.");
        return;
      }

      fetch(API_BASE + "/auth/verify-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token })
      })
        .then(function (response) {
          if (!response.ok) {
            return response.text().then(function (text) {
              throw new Error(text || "This link is invalid or has expired.");
            });
          }
          return response.json();
        })
        .then(function () {
          showResult(true, "Email verified", "Your account is fully set up. You can sign in whenever you're ready.");
        })
        .catch(function (error) {
          showResult(false, "Verification failed", error.message || "This link is invalid or has expired. Request a new one from the sign-in screen.");
        });
    })();
  </script>
</body>
</html>
