syntax = "proto3";
package afp;

service AFPService {
  rpc SendMessage (Message) returns (Ack) {}
  rpc GetThread (ThreadRequest) returns (ThreadResponse) {}
}

message Message {
  string protocol = 1;
  string id = 2;
  string thread_id = 3;
  string parent_id = 4;
  string from = 5;
  repeated string to = 6;
  string timestamp = 7;
  string type = 8;           // Broad family, e.g. ledger, relation_link, knowledge_link
  optional string kind = 9;
  string content = 10;       // JSON string
  string signature = 11;
  string encryption = 12;   // JSON string
  string views = 13;        // JSON array string
  string references = 14;   // JSON array string
  string attachments = 15;  // JSON array string
  bool store_in_relational = 16;
  string subtype = 17;
  string metadata = 18;     // JSON object string for structured message context
  repeated string supertags = 19;
}

message Ack { bool success = 1; string message_id = 2; }
message ThreadRequest { string thread_id = 1; }
message ThreadResponse { repeated Message messages = 1; }
