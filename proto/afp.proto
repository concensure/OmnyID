syntax = "proto3";
package afp;

service AFPService {
  rpc SendMessage (Message) returns (Ack) {}
  rpc GetThread (ThreadRequest) returns (ThreadResponse) {}
}

message Message {
  string protocol = 1;
  string id = 2;
  string thread_id = 3;
  string parent_id = 4;
  string from = 5;
  repeated string to = 6;
  string timestamp = 7;
  string type = 8;
  string content = 9;       // JSON string
  string signature = 10;
  string encryption = 11;   // JSON string
  string views = 12;        // JSON array string
  string references = 13;   // JSON array string
  string attachments = 14;  // JSON array string
  bool store_in_relational = 15;
  string subtype = 16;
  string metadata = 17;     // JSON object string for structured message context
}

message Ack { bool success = 1; string message_id = 2; }
message ThreadRequest { string thread_id = 1; }
message ThreadResponse { repeated Message messages = 1; }
