[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "afp"
version = "1.0.0"
description = "Agent Forward Protocol (AFP) Python SDK for OmnyID homeservers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14,<3.15"
dependencies = ["httpx", "pydantic", "ulid-py", "pynacl", "websockets", "aioquic"]

[project.urls]
Repository = "https://github.com/omnyid/homeserver"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
afp = ["py.typed"]
