<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmnyID — Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #1a1c1b;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  canvas { display: block; }
  #replay {
    position: fixed; bottom: 1.8rem; left: 50%; transform: translateX(-50%);
    padding: 5px 18px; background: transparent;
    border: 1px solid rgba(115,119,129,0.35); color: rgba(115,119,129,0.6);
    font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; cursor: pointer; border-radius: 2px;
    transition: border-color 0.25s, color 0.25s;
  }
  #replay:hover { border-color: #31568e; color: #d96b39; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="replay">Replay</button>
<script>
'use strict';

// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 600, H = 600;
canvas.width  = W;
canvas.height = H;
const CX = W / 2, CY = H / 2;

// ── Design palette ───────────────────────────────────────────────────────────
const P_RGB  = [49,  86,  142];   // #31568e — primary blue
const E_RGB  = [217, 107, 57];    // #d96b39 — ember orange

// ── Spiral geometry ──────────────────────────────────────────────────────────
// Logarithmic spiral: r = 18 + ((e^(b·t) – e^(b·tMin)) / (e^(b·tMax) – e^(b·tMin))) × 177
// Parameterised so inner arm ≈ 18 px from centre, outer tip ≈ 195 px.
const B     = 0.24;
const T_MIN = 0.45;
const T_MAX = Math.PI * 3.05;    // ≈ 1.5 full revolutions
const R_MIN_RAW = Math.exp(B * T_MIN);
const R_MAX_RAW = Math.exp(B * T_MAX);

function spiralR(t) {
  return 18 + ((Math.exp(B * t) - R_MIN_RAW) / (R_MAX_RAW - R_MIN_RAW)) * 177;
}

// Multi-octave perpendicular waviness — the "cosmological fractal" quality
function waveOffset(t, frac) {
  const amp = 4.2 * (1 - frac * 0.68);  // tapers toward outer tip
  return (
    Math.sin(t * 4.1)  * amp          +
    Math.sin(t * 9.7)  * amp * 0.32   +
    Math.sin(t * 21.3) * amp * 0.11   +
    Math.sin(t * 46.1) * amp * 0.04
  );
}

function spiralPoint(t, armOffset) {
  const frac = (t - T_MIN) / (T_MAX - T_MIN);
  const r     = spiralR(t);
  const angle = t + armOffset;
  const wave  = waveOffset(t, frac);
  const perp  = angle + Math.PI / 2;
  return {
    x:    CX + r * Math.cos(angle) + Math.cos(perp) * wave,
    y:    CY + r * Math.sin(angle) + Math.sin(perp) * wave,
    frac,
  };
}

// ── Logo target points ───────────────────────────────────────────────────────
function buildLogoPoints() {
  const pts = [];

  // Nucleus ring — blended colour
  const NUCLEUS_N = 32;
  for (let i = 0; i < NUCLEUS_N; i++) {
    const a   = (i / NUCLEUS_N) * Math.PI * 2;
    const r   = 1.2 + (i % 3) * 0.9;
    const mix = i / NUCLEUS_N;
    pts.push({
      x:   CX + r * Math.cos(a),
      y:   CY + r * Math.sin(a),
      rgb: [
        P_RGB[0] * (1 - mix) + E_RGB[0] * mix,
        P_RGB[1] * (1 - mix) + E_RGB[1] * mix,
        P_RGB[2] * (1 - mix) + E_RGB[2] * mix,
      ],
      frac: 0,
    });
  }

  // Arm samples
  const ARM_N = 132;
  for (let arm = 0; arm < 2; arm++) {
    const offset = arm === 0 ? 0 : Math.PI;
    const rgb    = arm === 0 ? P_RGB : E_RGB;
    for (let i = 0; i < ARM_N; i++) {
      const t  = T_MIN + (i / (ARM_N - 1)) * (T_MAX - T_MIN);
      const sp = spiralPoint(t, offset);
      pts.push({ x: sp.x, y: sp.y, rgb, frac: sp.frac });
    }
  }

  return pts;
}

const LOGO_PTS = buildLogoPoints();
const N        = LOGO_PTS.length;   // 296

// ── Particle class ───────────────────────────────────────────────────────────
class Particle {
  constructor(i) {
    this.i   = i;
    this.tgt = LOGO_PTS[i];
    this.sz  = 0.85 + Math.random() * 1.5;
    this.init();
  }

  init() {
    this.x  = CX + (Math.random() - 0.5) * 3;
    this.y  = CY + (Math.random() - 0.5) * 3;
    this.vx = 0; this.vy = 0;
    this.exploded = false;

    // Burst velocity: 60 % biased toward target direction + spiral lean
    const tAngle  = Math.atan2(this.tgt.y - CY, this.tgt.x - CX);
    const rndAngle = Math.random() * Math.PI * 2;
    const blend   = tAngle + (rndAngle - tAngle) * 0.4;
    const spiralLean = blend + (this.tgt.frac > 0.5 ? 0.45 : -0.45);
    const speed   = 1.8 + Math.random() * 3.8;
    this.bvx = Math.cos(spiralLean) * speed;
    this.bvy = Math.sin(spiralLean) * speed;
  }
}

let parts = Array.from({ length: N }, (_, i) => new Particle(i));

// ── Phase timings (frames @ ~60 fps) ─────────────────────────────────────────
const T = {
  SING_END:   85,   // singularity holds
  EXPL_END:  220,   // explosion bursts outward
  STAR_END:  330,   // coasting / star shape
  MORPH_END: 550,   // spiral spring-attraction
  CRYS_END:  625,   // crystallisation / vector logo fades in
};

let frame = 0;
let raf;

// ── Easing ────────────────────────────────────────────────────────────────────
function easeInOutQuart(t) {
  return t < 0.5 ? 8 * t * t * t * t : 1 - Math.pow(-2 * t + 2, 4) / 2;
}
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// ── Particle update ───────────────────────────────────────────────────────────
function updateParticle(p) {
  const f = frame;

  // Singularity — huddle at centre
  if (f <= T.SING_END) {
    p.x = CX + (Math.random() - 0.5) * 1.8;
    p.y = CY + (Math.random() - 0.5) * 1.8;
    return;
  }

  // Explosion burst
  if (f <= T.EXPL_END) {
    if (!p.exploded) { p.vx = p.bvx; p.vy = p.bvy; p.exploded = true; }
    p.x  += p.vx; p.y  += p.vy;
    p.vy += 0.018;           // gentle gravity arc
    p.vx *= 0.984; p.vy *= 0.984;
    return;
  }

  // Coasting star — slow down, hint at swirl
  if (f <= T.STAR_END) {
    p.x  += p.vx * 0.45; p.y  += p.vy * 0.45;
    p.vx *= 0.91;         p.vy *= 0.91;
    return;
  }

  // Morph — spring + tangential vortex pull
  if (f <= T.MORPH_END) {
    const dx   = p.tgt.x - p.x;
    const dy   = p.tgt.y - p.y;
    const dist = Math.sqrt(dx * dx + dy * dy) + 0.001;

    const radial     = 0.055;
    const tangential = 0.022 * Math.min(dist / 90, 1);

    p.vx += dx * radial + (-dy / dist) * tangential * dist;
    p.vy += dy * radial + ( dx / dist) * tangential * dist;
    p.vx *= 0.81; p.vy *= 0.81;
    p.x  += p.vx; p.y  += p.vy;
    return;
  }

  // Crystallised — lock to target + micro shimmer
  const sh = 0.22 * Math.sin(frame * 0.09 + p.i * 0.63);
  p.x = p.tgt.x + (Math.random() - 0.5) * sh;
  p.y = p.tgt.y + (Math.random() - 0.5) * sh;
}

// ── Particle draw ─────────────────────────────────────────────────────────────
function drawParticle(p) {
  const [r, g, b] = p.tgt.rgb.map(v => v | 0);

  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.sz, 0, Math.PI * 2);
  ctx.fill();

  // Soft halo — only when large or early on
  if (p.sz > 1.6 || frame < T.EXPL_END + 30) {
    ctx.fillStyle = `rgba(${r},${g},${b},0.10)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.sz * 4.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ── Singularity glow ─────────────────────────────────────────────────────────
function drawSingularity() {
  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.19);
  const outer = 60 + pulse * 28;

  const grd = ctx.createRadialGradient(CX, CY, 0, CX, CY, outer);
  grd.addColorStop(0,    `rgba(255,215,165,${0.95 * pulse})`);
  grd.addColorStop(0.22, `rgba(217,107,57,${0.60 * pulse})`);
  grd.addColorStop(0.52, `rgba(49,86,142,${0.28 * pulse})`);
  grd.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(CX, CY, outer, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(255,235,205,${0.75 + 0.25 * pulse})`;
  ctx.beginPath();
  ctx.arc(CX, CY, 2.5 + pulse * 2.5, 0, Math.PI * 2);
  ctx.fill();
}

// ── Flash & shockwaves ───────────────────────────────────────────────────────
function drawExplosionFX() {
  const f = frame;

  // White flash at moment of detonation
  if (f > T.SING_END && f < T.SING_END + 14) {
    const a = 1 - (f - T.SING_END) / 14;
    ctx.fillStyle = `rgba(255,225,190,${a * 0.55})`;
    ctx.fillRect(0, 0, W, H);
  }

  // Expanding shock rings
  if (f > T.SING_END && f < T.EXPL_END + 50) {
    const p = Math.min((f - T.SING_END) / (T.EXPL_END - T.SING_END), 1);

    ctx.strokeStyle = `rgba(217,107,57,${(1 - p) * 0.75})`;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.arc(CX, CY, p * 240, 0, Math.PI * 2);
    ctx.stroke();

    if (p > 0.22) {
      const p2 = (p - 0.22) / 0.78;
      ctx.strokeStyle = `rgba(49,86,142,${(1 - p2) * 0.50})`;
      ctx.lineWidth   = 1;
      ctx.beginPath();
      ctx.arc(CX, CY, p2 * 205, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

// ── Final vector logo ─────────────────────────────────────────────────────────
function drawVectorArm(armOffset, rgb, baseWidth) {
  const STEPS = 500;
  const pts   = [];

  for (let i = 0; i <= STEPS; i++) {
    const frac  = i / STEPS;
    const t     = T_MIN + frac * (T_MAX - T_MIN);
    const sp    = spiralPoint(t, armOffset);
    pts.push({ x: sp.x, y: sp.y, frac });
  }

  ctx.save();
  ctx.lineCap  = 'round';
  ctx.lineJoin = 'round';
  const [r, g, b] = rgb;

  // Main arm stroke — variable alpha + width taper
  for (let i = 0; i < pts.length - 1; i++) {
    const f   = pts[i].frac;
    const lw  = baseWidth * (1 - f * 0.72);
    const alp = 0.92 - f * 0.68;
    ctx.strokeStyle = `rgba(${r},${g},${b},${alp})`;
    ctx.lineWidth   = lw;
    ctx.beginPath();
    ctx.moveTo(pts[i].x,   pts[i].y);
    ctx.lineTo(pts[i+1].x, pts[i+1].y);
    ctx.stroke();
  }

  // Soft glow halo (sparse pass)
  for (let i = 0; i < pts.length - 1; i += 5) {
    const f   = pts[i].frac;
    const glw = baseWidth * 8 * (1 - f * 0.58);
    ctx.strokeStyle = `rgba(${r},${g},${b},0.045)`;
    ctx.lineWidth   = glw;
    ctx.beginPath();
    ctx.moveTo(pts[i].x,   pts[i].y);
    ctx.lineTo(pts[i+1].x, pts[i+1].y);
    ctx.stroke();
  }

  ctx.restore();
}

function drawNucleusGlow(t) {
  const pulse = 0.7 + 0.3 * Math.sin(t * 0.055);
  const cg    = ctx.createRadialGradient(CX, CY, 0, CX, CY, 18 * pulse);
  cg.addColorStop(0,    `rgba(255,228,200,${0.95 * pulse})`);
  cg.addColorStop(0.30, `rgba(217,107,57,${0.75 * pulse})`);
  cg.addColorStop(0.62, `rgba(49,86,142,${0.40 * pulse})`);
  cg.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.arc(CX, CY, 18 * pulse, 0, Math.PI * 2);
  ctx.fill();
}

function drawFinalLogo(alpha, t) {
  ctx.save();
  ctx.globalAlpha = alpha;
  drawVectorArm(0,          P_RGB, 3.0);  // blue arm
  drawVectorArm(Math.PI,    E_RGB, 3.0);  // ember arm
  drawNucleusGlow(t);
  ctx.restore();
}

// ── Idle loop (after crystallisation) ────────────────────────────────────────
let idleFrame = 0;
function idleLoop() {
  idleFrame++;
  ctx.clearRect(0, 0, W, H);
  drawFinalLogo(1, idleFrame);

  // Wandering sparks along the arms
  if (idleFrame % 5 === 0) {
    const armOffset = Math.random() < 0.5 ? 0 : Math.PI;
    const rgb       = armOffset === 0 ? P_RGB : E_RGB;
    const t         = T_MIN + Math.random() * (T_MAX - T_MIN);
    const sp        = spiralPoint(t, armOffset);
    const [r, g, b] = rgb.map(v => v | 0);
    const alpha     = 0.30 + Math.random() * 0.45;
    const radius    = 0.6 + Math.random() * 1.1;
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.beginPath();
    ctx.arc(sp.x + (Math.random()-0.5)*3, sp.y + (Math.random()-0.5)*3, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  raf = requestAnimationFrame(idleLoop);
}

// ── Main animation loop ───────────────────────────────────────────────────────
function animate() {
  const f = frame;

  // Background clear / trail
  if (f < T.CRYS_END) {
    const trailAlpha = f > T.MORPH_END ? 0.35 : 0.18;
    ctx.fillStyle = `rgba(26,28,27,${trailAlpha})`;
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.clearRect(0, 0, W, H);
  }

  // Phase-specific draws
  if (f <= T.SING_END) drawSingularity();
  if (f >  T.SING_END) drawExplosionFX();

  // Particles
  parts.forEach(p => { updateParticle(p); drawParticle(p); });

  // Vector logo fades in as particles crystallise
  if (f >= T.MORPH_END) {
    const prog  = (f - T.MORPH_END) / (T.CRYS_END - T.MORPH_END);
    drawFinalLogo(easeInOutQuart(Math.min(prog, 1)), f);
  }

  frame++;
  if (frame < T.CRYS_END + 10) {
    raf = requestAnimationFrame(animate);
  } else {
    idleLoop();
  }
}

// ── Start / replay ────────────────────────────────────────────────────────────
function start() {
  if (raf) cancelAnimationFrame(raf);
  ctx.clearRect(0, 0, W, H);
  frame     = 0;
  idleFrame = 0;
  parts.forEach(p => p.init());
  animate();
}

document.getElementById('replay').addEventListener('click', start);
start();
</script>
</body>
</html>
